<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>FYND 릴스 01 · 버스 좌석 4,500석</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 움직이는 릴스(9:16, 1080×1920, 약 13초). render(t)가 시간 t초의 화면을 그린다.
   글자는 인스타 화면에서 가려지지 않는 가로 96~940px, 세로 300~1440px 안에 둔다. */
:root{--dark:#0A0A0B;--white:#FFFFFF;--g1:#CFCFD1;--g2:#818185;--red:#DD010F;--sans:'Noto Sans KR',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:var(--sans)}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;color:var(--white);word-break:keep-all;
  background-color:var(--dark);background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:90px 90px;background-position:-1px -1px}
.scene{position:absolute;left:96px;right:140px;top:340px;bottom:440px;display:flex;flex-direction:column;justify-content:center;opacity:0}
.ln{opacity:0;will-change:transform}
.logo{position:absolute;left:96px;top:300px;height:40px;opacity:0}
.s{font-size:56px;font-weight:700;color:var(--g1);line-height:1.35}
.m{font-size:104px;font-weight:900;line-height:1.2;letter-spacing:-.035em}
.xl{font-size:290px;font-weight:900;line-height:.95;letter-spacing:-.06em;color:var(--red);font-variant-numeric:tabular-nums}
.xl small{font-size:120px;letter-spacing:-.03em;margin-left:8px}
.red{color:var(--red)}
.bar{display:inline-block;position:relative;z-index:0;padding:0 14px}
.bar i{position:absolute;left:0;right:0;top:12%;bottom:8%;background:var(--red);transform-origin:left;transform:scaleX(0);z-index:-1}
.bar b{position:relative;font-weight:900}
.qr{width:330px;height:330px;position:relative;margin-top:56px;border:6px solid var(--white)}
.qr span{position:absolute;width:96px;height:96px;border:16px solid var(--white)}
.qr span:nth-child(1){left:24px;top:24px}.qr span:nth-child(2){right:24px;top:24px}.qr span:nth-child(3){left:24px;bottom:24px}
.qr em{position:absolute;left:150px;top:150px;width:40px;height:40px;background:var(--red)}
.cta{display:inline-block;background:var(--red);padding:30px 44px;font-size:60px;font-weight:900;letter-spacing:-.02em;margin-top:60px}
.foot{position:absolute;left:96px;top:1390px;font-size:34px;line-height:1.5;color:var(--g1);opacity:0}
</style>
</head>
<body>
<div id="stage">
  <img class="logo" id="logo" src="../assets/fynd-logo-white.png" alt="FYND">

  <!-- 1 훅: 숫자가 0에서 4,500으로 올라간다 -->
  <div class="scene" data-in="0" data-out="2.0">
    <p class="ln s" data-at="0" data-fx="up">충남을 달리는 버스 좌석</p>
    <p class="ln xl" data-at="0" data-fx="pop"><span data-count="4500" data-from="0.1" data-dur="1.1">0</span><small>석</small></p>
  </div>

  <!-- 2 근거 -->
  <div class="scene" data-in="2.0" data-out="3.9">
    <p class="ln s" data-at="0.05" data-fx="up">영진관광 45인승 버스</p>
    <p class="ln m" data-at="0.35" data-fx="up"><span class="red">100대</span>가 넘어요.</p>
  </div>

  <!-- 3 QR -->
  <div class="scene" data-in="3.9" data-out="6.0">
    <p class="ln m" data-at="0.05" data-fx="up">좌석 뒤마다</p>
    <p class="ln m" data-at="0.35" data-fx="up">QR이 붙습니다.</p>
    <div class="ln qr" data-at="0.7" data-fx="pop"><span></span><span></span><span></span><em></em></div>
  </div>

  <!-- 4 반전 -->
  <div class="scene" data-in="6.0" data-out="8.2">
    <p class="ln s" data-at="0.05" data-fx="up">손님이 찍으면 뜨는 건</p>
    <p class="ln m" data-at="0.4" data-fx="up"><span class="bar"><i data-wipe="0.75"></i><b>충남 동네 가게</b></span></p>
    <p class="ln m" data-at="0.4" data-fx="up">입니다.</p>
  </div>

  <!-- 5 선착순 -->
  <div class="scene" data-in="8.2" data-out="10.4">
    <p class="ln s" data-at="0.05" data-fx="up">맨 위 자리는</p>
    <p class="ln xl" data-at="0.3" data-fx="pop">20<small>곳</small></p>
    <p class="ln m" data-at="0.75" data-fx="up">먼저 오는 순서로.</p>
  </div>

  <!-- 6 마무리 -->
  <div class="scene" data-in="10.4" data-out="99">
    <p class="ln m" data-at="0.05" data-fx="up">우리 가게도<br>될까요?</p>
    <p class="ln cta" data-at="0.45" data-fx="pop">댓글에 '버스' 남겨 주세요</p>
  </div>
  <p class="foot" id="foot">FYND는 충남 사장님들이<br>서로 돕는 네트워크를 만듭니다.</p>
</div>

<script>
const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
const back = x => { x = Math.min(Math.max(x, 0), 1); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const F = 0.18; // 장면 전환 시간
window.render = function (t) {
  document.querySelectorAll('.scene').forEach(sc => {
    const a = +sc.dataset.in, b = +sc.dataset.out, lt = t - a;
    const op = t < a || t > b ? 0 : Math.min(1, lt / F, (b - t) / F);
    sc.style.opacity = op;
    sc.style.transform = `translateY(${t > b - F ? (1 - (b - t) / F) * -40 : 0}px)`;
    sc.querySelectorAll('.ln').forEach(el => {
      const p = (lt - +el.dataset.at) / 0.35;
      el.style.opacity = ease(p);
      el.style.transform = el.dataset.fx === 'pop'
        ? `scale(${0.6 + 0.4 * back(p)})` : `translateY(${(1 - ease(p)) * 60}px)`;
      el.style.transformOrigin = 'left center';
    });
    sc.querySelectorAll('[data-count]').forEach(el => {
      const p = ease((lt - +el.dataset.from) / +el.dataset.dur);
      el.textContent = Math.round(+el.dataset.count * p).toLocaleString('ko-KR');
    });
    sc.querySelectorAll('[data-wipe]').forEach(el => {
      el.style.transform = `scaleX(${ease((lt - +el.dataset.wipe) / 0.3)})`;
    });
  });
  const logoOp = Math.max(t < 2.0 ? Math.min(1, t / F, (2.0 - t) / F) : 0, t > 10.4 ? Math.min(1, (t - 10.4) / F) : 0);
  document.getElementById('logo').style.opacity = logoOp;
  document.getElementById('foot').style.opacity = t > 11.1 ? ease((t - 11.1) / 0.4) : 0;
};
window.render(0);
</script>
</body>
</html>
